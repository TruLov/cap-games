_schema-version: 3.3.0
ID: cap-games
version: 1.0.0
description: "Browser mini games with CAP backend"
parameters:
  enable-parallel-deployments: true
  # Set at deploy time (mta extension or `cf ... --var`); the AI Core deployment id.
  aicore-deployment-id: ""
  # Set to "true" only if aicore-deployment-id points at a reasoning-family
  # model (gpt-5*, o1*, o3*, o4*, ...) — see srv/ai/aicore.js.
  aicore-reasoning-model: ""
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: cap-games-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    properties:
      # AI Core deployment to use (env-specific, non-secret). The service key is
      # injected by the cap-games-aicore binding below; the SDK reads it natively.
      AICORE_DEPLOYMENT_ID: "${aicore-deployment-id}"
      AICORE_REASONING_MODEL: "${aicore-reasoning-model}"
    requires:
      - name: cap-games-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: cap-games-postgres
      - name: cap-games-aicore

  - name: cap-games-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: cap-games-postgres

  - name: cap-games
    type: approuter.nodejs
    path: app/router
    requires:
      - name: cap-games-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: approuter
      - name: srv-api
        group: destinations
        properties:
          url: ~{srv-cert-url}
          forwardAuthCertificates: true
          forwardAuthToken: true
          strictSSL: true
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: cap-games-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: cap-games-ias
      service-plan: application
      config:
        provided-apis:
          - name: cap-games-ias-api
            description: API exposed by the application
        display-name: cap-games
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
          redirect-uris:
            - http://localhost:5000/login/callback?authType=ias
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/login/callback
          post-logout-redirect-uris:
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/*/logout.html
        xsuaa-cross-consumption: true
    requires:
      - name: app-api

  - name: cap-games-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: development

  # AI Core — the [production] profile binds this; the SAP AI SDK reads its
  # credentials natively via the service binding (no AICORE_SERVICE_KEY env).
  - name: cap-games-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
