_schema-version: 3.3.0
ID: cap-games
version: 1.0.0
description: "Gambito — browser mini games with CAP backend"
parameters:
  enable-parallel-deployments: true
  # AI Core is external to this landscape (different global account) — no
  # cap-games-aicore service binding here. Set all three via an .mtaext
  # overlay at deploy time (`cf deploy ... -e config.mtaext`), never inline.
  aicore-deployment-id: ""
  # Set to "true" only if aicore-deployment-id points at a reasoning-family
  # model (gpt-5*, o1*, o3*, o4*, ...) — see srv/ai/aicore.js.
  aicore-reasoning-model: ""
  # Full AI-Core service-key JSON (secret) — same shape as .env.example's
  # AICORE_SERVICE_KEY. The SAP AI SDK reads it from the env var natively.
  aicore-service-key: ""
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        # --ws-pack: games/* are npm workspace deps ("*" version) — pack them
        # as tarballs instead of leaving lockfile workspace-symlink entries,
        # which break once gen/srv is built/packaged in isolation (no games/
        # sibling folder there for the symlink target to resolve against).
        - npx cds build --production --ws-pack
        # The approuter serves the shell UI statically from its resources/
        # folder. Source of truth stays in app/ (so `cds watch app` dev is
        # unchanged); scripts/sync-approuter.mjs copies it in here — same
        # script `npm run dev`/`npm start` run locally, so there's exactly
        # one place that knows which files make up the shell.
        - node scripts/sync-approuter.mjs
modules:
  - name: cap-games-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    properties:
      # AI Core is an external/cross-account service — no VCAP binding, so
      # the SDK's env-var credential path is used instead. AICORE_SERVICE_KEY
      # comes from an .mtaext overlay at deploy time, never committed here.
      AICORE_DEPLOYMENT_ID: "${aicore-deployment-id}"
      AICORE_REASONING_MODEL: "${aicore-reasoning-model}"
      AICORE_SERVICE_KEY: "${aicore-service-key}"
    requires:
      - name: cap-games-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: cap-games-postgres

  - name: cap-games-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: cap-games-postgres

  - name: cap-games
    type: approuter.nodejs
    path: app/router
    requires:
      - name: cap-games-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: approuter
      - name: srv-api
        group: destinations
        properties:
          url: ~{srv-cert-url}
          forwardAuthCertificates: true
          forwardAuthToken: true
          strictSSL: true
    properties:
      # Force the OAuth callback URL to carry ?authType=ias. Without it, the
      # approuter only appends authType when >1 auth service is bound (IAS AND
      # XSUAA); we bind IAS only, so the callback would arrive bare and the
      # handler defaults the missing param to "xsuaa" → "OAuth2 requires
      # clientid" crash on /login/callback. (@sap/approuter getCallBackUrl.)
      ENABLE_PERMANENT_AUTHTYPE: "true"
      # Include id_token_hint on the IAS end-session redirect so IAS can
      # cleanly identify and terminate the session being logged out of,
      # instead of a bare redirect with no session context.
      LOGOUT_WITH_TOKEN_HINT: "true"
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: cap-games-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: cap-games-ias
      service-plan: application
      config:
        provided-apis:
          - name: cap-games-ias-api
            description: API exposed by the application
        display-name: cap-games
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
          redirect-uris:
            - http://localhost:5000/login/callback?authType=ias
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/login/callback
          post-logout-redirect-uris:
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/logout.html
        xsuaa-cross-consumption: true
    requires:
      - name: app-api

  - name: cap-games-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
