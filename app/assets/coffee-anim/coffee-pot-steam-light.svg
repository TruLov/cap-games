<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 84" shape-rendering="crispEdges" role="img" aria-label="Pixel espresso cup with rising steam">
  <style>
    .steam { animation: rise 3.2s steps(8, jump-none) infinite; opacity: 0; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 2.2s; }
    @keyframes rise {
      0%   { transform: translate(0, 0);   opacity: 0; }
      8%   { opacity: .9; }
      45%  { transform: translate(-4px, -20px); opacity: .6; }
      70%  { transform: translate(4px, -30px);  opacity: .3; }
      100% { transform: translate(0, -40px);    opacity: 0; }
    }
  </style>

  <rect class="steam s1" x="26" y="44" width="4" height="4" fill="#6b4f3d"/>
  <rect class="steam s2" x="32" y="44" width="4" height="4" fill="#2c1f15"/>
  <rect class="steam s3" x="29" y="40" width="4" height="4" fill="#6b4f3d"/>

  <rect x="20" y="52" width="24" height="28" fill="#7a4f3a"/>

