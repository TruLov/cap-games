<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 84" shape-rendering="crispEdges" role="img" aria-label="Pixel espresso cup resting quietly, cursor blinking">
  <style>
    .wisp { animation: drift 6s steps(6, jump-none) infinite; opacity: 0; }
    @keyframes drift {
      0%   { transform: translate(0, 0);  opacity: 0; }
      10%  { opacity: .5; }
      55%  { transform: translate(-2px, -12px); opacity: .35; }
      100% { transform: translate(0, -22px);     opacity: 0; }
    }
  </style>

  <rect class="wisp" x="30" y="44" width="4" height="4" fill="#6b4f3d"/>

