<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing in… - Gambito</title>
</head>
<body>
  <!--
    This page is served ONLY when the approuter has confirmed a valid IAS
    session (route authenticationType: ias). Reaching it therefore means we're
    logged in - just hand off to the shell. If there is no session the approuter
    302s to IAS *before* this file is ever served, so no auth check is needed here.

    The route is marked cacheControl: no-store (xs-app.json) so the browser never
    reuses a cached copy after logout - otherwise the IAS redirect would be skipped.
  -->
  <script>location.replace('/');</script>
</body>
</html>
